services:
  postgres:
    image: postgres:16-alpine
    container_name: nexcomerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nexcomerce}
      POSTGRES_USER: ${POSTGRES_USER:-nexcomerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexcomerce_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - nexcomerce-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexcomerce} -d ${POSTGRES_DB:-nexcomerce}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nexcomerce-pgdata:
